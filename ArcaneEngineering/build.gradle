plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.42' }
version = '0.1.4'
group = 'arcane_engineering'
base.archivesName = '[TC4Continuation]Arcane-Engineering'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
sourceSets { verification { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.runtimeClasspath } }
repositories {
    flatDir { dirs 'dependencies/jars' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    implementation fg.deobf("local.validation:Thaumcraft:${findProperty('tc4ValidationVersion') ?: '0.4.121'}")
    implementation fg.deobf('local.collab:immersiveengineering:local')
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api')
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    runtimeOnly fg.deobf('maven.modrinth:terrablender:HI0iCUpi')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            args '--mixin.config', 'tc4revival.mixins.json', '--mixin.config', 'arcane_engineering.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods { arcane_engineering { source sourceSets.main } }
            if (project.hasProperty('verification')) mods { arcane_engineering_validation { source sourceSets.verification } }
        }
        server { workingDirectory file('run-server'); args '--nogui'; jvmArgs '-Xmx2G' }
        client { workingDirectory file('run-client'); jvmArgs '-Xmx3G' }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
tasks.named('processResources') { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand version: project.version } }
tasks.named('jar') { manifest { attributes 'MixinConfigs': 'arcane_engineering.mixins.json' }; finalizedBy 'reobfJar' }
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '256m'; maxParallelForks = 1 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('verificationJar', Jar) { from sourceSets.verification.output; archiveBaseName = 'ArcaneEngineeringVerification'; archiveClassifier = 'test-only'; finalizedBy 'reobfVerificationJar' }
reobf { verificationJar { classpath.from(sourceSets.verification.compileClasspath) } }
tasks.register('verifyExternalResources') {
    dependsOn 'jar', 'reobfJar', 'sourcesJar'
    doLast { ['jar','sourcesJar'].each { taskName -> new java.util.zip.ZipFile(tasks.named(taskName).get().archiveFile.get().asFile).withCloseable { zip -> zip.entries().each { e ->
        if (e.name ==~ /.*\.(png|ogg|lang|obj)/ || e.name.startsWith('tc4revival/') || e.name.startsWith('thaumcraft/api/')) throw new GradleException("Bundled legacy resource or dependency: ${e.name}")
    } } } }
}

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        from('LICENSE', 'NOTICE')
    }
}

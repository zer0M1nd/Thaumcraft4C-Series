plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.42' }
version = rootProject.version
group = 'dev.tc4.updaterui'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.23' }
sourceSets.main.resources.srcDir '../src/main/resources'
tasks.named('processResources') {
    from(rootProject.files('LICENSE', 'NOTICE'))
    exclude 'META-INF/services/**'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar') {
    archiveFileName = 'thaumcraftupdater-marker.jar'
    manifest { attributes 'FMLModType': 'MOD', 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.42' }
version = '0.1.4'
group = 'infusionbrewing'
base.archivesName = '[TC4Continuation]Infusion-Brewing'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
sourceSets { serverTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
repositories {
    flatDir { dirs 'dependencies/jars' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    implementation fg.deobf("local.validation:Thaumcraft:${findProperty('tc4ValidationVersion') ?: '0.4.121'}")
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api')
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    runtimeOnly fg.deobf('maven.modrinth:terrablender:HI0iCUpi')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            args '--mixin.config', 'tc4revival.mixins.json', '--mixin.config', 'infusionbrewing.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods { infusionbrewing { source sourceSets.main } }
            jvmArgs "-Xmx${findProperty('runHeap') ?: '2G'}", "-XX:ActiveProcessorCount=${findProperty('runProcessors') ?: '4'}"
        }
        server { workingDirectory file('run-server'); args '--nogui' }
        client { workingDirectory file('run-client') }
        gameTestServer {
            workingDirectory file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'infusionbrewing'
            mods { infusionbrewing { source sourceSets.serverTest } }
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
tasks.named('processResources') { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand version: project.version } }
tasks.named('jar') { manifest { attributes 'MixinConfigs': 'infusionbrewing.mixins.json' }; finalizedBy 'reobfJar' }
tasks.named('test') { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('verifyExternalResources') {
    dependsOn 'jar', 'reobfJar', 'sourcesJar'
    doLast {
        ['jar','sourcesJar'].each { name ->
            new java.util.zip.ZipFile(tasks.named(name).get().archiveFile.get().asFile).withCloseable { zip ->
                zip.entries().each { e ->
                    if (e.name ==~ /.*\.(png|ogg|lang|obj)/ || e.name.startsWith('tc4revival/') || e.name.startsWith('thaumcraft/api/') || e.name.startsWith('mariri/'))
                        throw new GradleException("Bundled legacy asset or foreign class: ${e.name}")
                }
            }
        }
    }
}

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        from('LICENSE', 'NOTICE')
    }
}

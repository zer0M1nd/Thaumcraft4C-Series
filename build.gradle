plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.42' }
version=mod_version
group='wgmodern'
base.archivesName='[TC4Continuation]Witching-Gadgets'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
java.withSourcesJar()
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
repositories { flatDir { dirs '../ForbiddenMagic/libs','.tooling/compat-libs' }; maven { url=uri('.tooling/maven') }; maven { url='https://maven.theillusivec4.top/' }; mavenCentral() }
repositories {
    flatDir { dirs "../../../Data/Dependencies/TC4/${findProperty('tc4ValidationVersion') ?: '0.4.114'}" }
    maven { url='https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    runtimeOnly fg.deobf('maven.modrinth:terrablender:HI0iCUpi')
 minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
 implementation fg.deobf(project.hasProperty('tc4ValidationVersion')
        ? "local.validation:Thaumcraft-4-Modern-Port:${project.property('tc4ValidationVersion')}"
        : 'local.revival:Thaumcraft-4-Modern-Port:0.4.114')
 implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
 compileOnly fg.deobf('local:botania:455')
 compileOnly files('../../TC4/libs/jei-1.20.1-common-api-15.20.0.106.jar','../../TC4/libs/jei-1.20.1-forge-api-15.20.0.106.jar')
 compileOnly fg.deobf('local:cbmultipart:3.3.0.159')
 compileOnly fg.deobf('local:codechickenlib:4.4.0.528')
 if (project.hasProperty('withWGIntegrations')) { runtimeOnly fg.deobf('local:cbmultipart:3.3.0.159'); runtimeOnly fg.deobf('local:codechickenlib:4.4.0.528'); runtimeOnly fg.deobf('local:botania:455'); runtimeOnly fg.deobf('local:patchouli:85'); runtimeOnly fg.deobf('local:tconstruct:3.12.1.231'); runtimeOnly fg.deobf('local:mantle:1.11.117'); runtimeOnly fg.deobf('local:rackitup:1.3.6') }
 testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
minecraft {
 mappings channel:'official',version:'1.20.1'
 runs {
  configureEach {
   args '--mixin.config','tc4revival.mixins.json','--mixin.config','witchinggadgets.mixins.json'
   property 'mixin.env.remapRefMap','true'
   property 'mixin.env.refMapRemappingFile',layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
   property 'forge.enableGameTest','true'
   property 'forge.enabledGameTestNamespaces','witchinggadgets'
   mods { witchinggadgets { source sourceSets.main } }
  }
  server { workingDirectory project.file('run-server'); args '--nogui' }
  client { workingDirectory project.file('run-client') }
  data { workingDirectory project.file('run-data'); args '--mod','witchinggadgets','--all','--output',file('src/generated/resources/').absolutePath,'--existing',file('src/main/resources/').absolutePath }
 }
}
sourceSets.main.resources.srcDir 'src/generated/resources'
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=17 }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { manifest.attributes('MixinConfigs':'witchinggadgets.mixins.json'); finalizedBy 'reobfJar' }
tasks.named('processResources') { inputs.property 'version',project.version; filesMatching('META-INF/mods.toml') { expand version:project.version } }
tasks.register('verifyExternalResources') { dependsOn 'jar','reobfJar'; doLast { new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip -> zip.entries().each { e -> if(e.name==~ /.*\.(png|ogg|lang|obj)/) throw new GradleException('Bundled legacy asset '+e.name) } } } }

// Resource metadata must be UTF-8 on every build host.
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        from('LICENSE', 'NOTICE')
    }
}

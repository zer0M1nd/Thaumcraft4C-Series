plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.42' }
version = '0.1.7.1'
group = 'thaumicconcilium'
base.archivesName = 'Thaumic-Concilium-Modern-Port'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
sourceSets {
    serverTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
repositories {
    flatDir { dirs "../../../Data/Dependencies/TC4/${findProperty('tc4ValidationVersion') ?: '0.4.114'}" }
    flatDir { dirs '../ForbiddenMagic/build/libs', '../ThaumicTinkerer/build/libs', '../Gadomancy/build/libs' }
    flatDir { dirs '../ForbiddenMagic/libs' }
    flatDir { dirs '../../../References/Projects/ThaumicConcilium/witchery-modern-doomcat' }
    flatDir { dirs '../../../References/Projects/ThaumicConcilium/ars-magica-legacy' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    implementation fg.deobf("local.validation:Thaumcraft-4-Modern-Port:${findProperty('tc4ValidationVersion') ?: '0.4.114'}")
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api')
    compileOnly fg.deobf('local:botania:455')
    compileOnly fg.deobf('local:bloodmagic:3.3.8-50')
    compileOnly fg.deobf('local:witchery-1.20.1-port:0.1.3.32-9376998')
    compileOnly fg.deobf('local:arsmagicalegacy:1.20.1-1.5.0')
    compileOnly fg.deobf("local.validation:Gadomancy-Modern-Port:${findProperty('gadomancyValidationVersion') ?: '0.1.11.2'}")
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    runtimeOnly fg.deobf('maven.modrinth:terrablender:HI0iCUpi')
    implementation fg.deobf("local.validation:Forbidden-Magic-Modern-Port:${findProperty('forbiddenMagicValidationVersion') ?: '0.1.16.1'}")
    implementation fg.deobf("local.validation:Thaumic-Tinkerer-Modern-Port:${findProperty('tinkererValidationVersion') ?: '0.1.38.2'}")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            args '--mixin.config', 'tc4revival.mixins.json', '--mixin.config', 'thaumicconcilium.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods { thaumicconcilium { source sourceSets.main } }
        }
        server { workingDirectory file('run-server'); args '--nogui' }
        client { workingDirectory file('run-client') }
        gameTestServer {
            workingDirectory file(findProperty('conciliumGameTestDirectory') ?: '../../../Data/Verification/20261031-01a19066-concilium/gametest-isolated')
            property 'forge.enabledGameTestNamespaces', 'thaumicconcilium'
            property 'forge.logging.console.level', 'info'
            mods { thaumicconcilium { source sourceSets.serverTest } }
            jvmArgs '-Xmx3G'
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('processResources') { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand version: project.version } }
tasks.named('jar') { manifest { attributes 'MixinConfigs': 'thaumicconcilium.mixins.json' }; finalizedBy 'reobfJar' }
tasks.named('test') { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('verifyExternalResources') {
    dependsOn 'jar', 'reobfJar', 'sourcesJar'
    doLast {
        ['jar', 'sourcesJar'].each { name ->
            new java.util.zip.ZipFile(tasks.named(name).get().archiveFile.get().asFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.name ==~ /.*\.(png|ogg|lang|obj)/ || entry.name.startsWith('tc4revival/') || entry.name.startsWith('thaumcraft/api/'))
                        throw new GradleException("Unexpected bundled original resource or base class: ${entry.name}")
                }
            }
        }
    }
}

// Resource metadata must be UTF-8 on every build host.
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        from('LICENSE', 'NOTICE')
    }
}

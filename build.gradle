plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.42' }
version = '0.1.46.1'
group = 'ttmodern'
base.archivesName = '[TC4Continuation]Thaumic-Tinkerer'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
repositories { maven { url = uri('.tooling/cached-maven') }; flatDir { dirs 'libs' }; maven { url = 'https://maven.theillusivec4.top/' }; mavenCentral() }
repositories {
    flatDir { dirs "../../../Data/Dependencies/TC4/${findProperty('tc4ValidationVersion') ?: '0.4.114'}" }
    maven { url='https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    runtimeOnly fg.deobf('maven.modrinth:terrablender:HI0iCUpi')
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(project.hasProperty('tc4ValidationVersion')
        ? "local.validation:Thaumcraft-4-Modern-Port:${project.property('tc4ValidationVersion')}"
        : 'local.revival:Thaumcraft-4-Modern-Port:0.4.114')
    compileOnly files('libs/thaumicbases-0.1.2.jar')
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    compileOnly files('libs/cc-tweaked-1.20.1-core-api-1.120.2.jar')
    compileOnly files('libs/cc-tweaked-1.20.1-forge-api-1.120.2.jar')
    compileOnly files('libs/jei-1.20.1-common-api-15.20.0.106.jar', 'libs/jei-1.20.1-forge-api-15.20.0.106.jar')
    compileOnly files('libs/Jade-1.20.1-Forge-11.13.1.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    if (providers.gradleProperty('ttIntegrations').isPresent()) {
        def selected = providers.gradleProperty('ttIntegrations').get().split(',').toList()
        new groovy.json.JsonSlurper().parse(file('.tooling/integration-runtime/resolved.json')).each { dependency ->
            if (selected.contains(dependency.coordinate.split(':')[1])) runtimeOnly fg.deobf(dependency.coordinate)
        }
    }
}
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            property 'forge.enableGameTest', 'true'
            property 'ttmodern.workspace', rootProject.projectDir.absolutePath
            property 'ttmodern.legacyJar', rootProject.file('../references/ThaumicTinkerer-2.5-1.7.10-164.jar').absolutePath
            property 'ttmodern.baseLegacyJar', rootProject.file('../../TC4/references/Thaumcraft-1.7.10-4.2.3.5.jar').absolutePath
            args '--mixin.config', 'tc4revival.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods {
                thaumic_tinkerer { source sourceSets.main }
            }
        }
        server {
            def serverFolder = rootProject.file(providers.gradleProperty('ttServerDirectory').getOrElse('run-server')).toPath().normalize()
            if (!serverFolder.startsWith(rootProject.projectDir.toPath())) throw new GradleException('Test server must remain inside the addon workspace')
            workingDirectory serverFolder.toFile()
            args '--nogui'
            jvmArgs providers.gradleProperty('ttServerHeap').map { '-Xmx'+it }.getOrElse('-Xmx2G')
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
tasks.register('verifyNoBundledLegacyAssets') {
    dependsOn 'jar', 'reobfJar', 'sourcesJar'
    doLast {
        ['jar','sourcesJar'].each { taskName ->
            new java.util.zip.ZipFile(tasks.named(taskName).get().archiveFile.get().asFile).withCloseable { zip ->
                if (taskName == 'jar' && !zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8').contains('version="' + project.version + '"')) {
                    throw new GradleException('Runtime metadata version does not match the release version')
                }
                zip.entries().each { entry ->
                    if (entry.name ==~ /.*\.(png|ogg|lang|obj)/) throw new GradleException("External resource bundled: ${entry.name}")
                    if (entry.name.startsWith('tc4revival/') || entry.name.startsWith('thaumcraft/api/')) throw new GradleException('Base mod classes bundled')
                }
            }
        }
    }
}

tasks.named("test") { useJUnitPlatform() }

tasks.register('verifyFrozenBase') {
    inputs.file('libs/BASELINE.json'); inputs.file('libs/thaumcraft-0.4.11.jar')
    doLast {
        def baseline = new groovy.json.JsonSlurper().parse(file('libs/BASELINE.json'))
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(file('libs/' + baseline.file).bytes).encodeHex().toString()
        if (actual != baseline.sha256) throw new GradleException('Frozen base JAR changed; do not rebuild or silently replace the base dependency.')
    }
}
tasks.named('compileJava') { dependsOn 'verifyFrozenBase' }


// Resource metadata must be UTF-8 on every build host.
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        from('LICENSE', 'NOTICE')
    }
}

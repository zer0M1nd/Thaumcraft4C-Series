plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.42' }
group = 'dev.tc4.resourceadapter'
version = '1.1.0.1'
base.archivesName = '[TC4Continuation]ThaumcraftResourceAdapter'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
apply from: 'dependencies/build.gradle'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar') {
    manifest { attributes 'Implementation-Title': 'ThaumcraftResourceAdapter', 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
tasks.named('test') {
    useJUnitPlatform()
    // Optional real archives remain outside the source tree and release JAR.
    ['adapter.fixture', 'adapter.reference'].each { key ->
        if (System.getProperty(key)) systemProperty key, System.getProperty(key)
    }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        from('LICENSE', 'NOTICE')
    }
}

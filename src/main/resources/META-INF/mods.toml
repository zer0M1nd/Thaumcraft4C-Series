description='''
This mod is part of the Thaumcraft 4: Continuation series.
Wield grappling and building foci from Thaumcraft 5 and rediscover Thaumcraft 6 devices and classic cross-mod recipes.

-------- Original release --------
Thaumcraft 5 and 6
Adding a touch of magic to Minecraft

Ex Astris
Ex Nihilo Addon

Ex Nihilo
Making the whole world renewable.

Magic Bees
Magic themed bee expansion for Forestry. TC4, Botania, EE3, AM 2, TE 3

Original credits: Thaumcraft 5 and 6: Special thanks to CovertJaguar, Dan Scott, Lorc, bonemouse, Scott Killen, Rorax and chicken_bones. Ex Nihilo: Cooley, for being my besty. =) Magic Bees: SirSengir, Azanor, Binnie & the Forestry Dev peeps.'''


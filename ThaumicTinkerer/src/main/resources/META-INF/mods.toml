This mod is part of the Thaumcraft 4: Continuation series.
Craft specialized tools and enchantments, then progress through infusion to unlock Ichor equipment.

-------- Original release --------
An addon to Thaumcraft 4, implementing new content. This mod is a spiritual successor to Elemental Tinkerer. Researches that come from this mod are prefixed by [TT].

Original credits: Azanor, TheAtlanticCraft, MartysGames, TheWhiteWolves, mDiyo, theFlaxbeard. The original preloader also credits nekosune and Pixlepix and gives special thanks to Vazkii.'''

